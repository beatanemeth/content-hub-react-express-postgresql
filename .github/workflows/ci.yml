name: CI

# Controls when the workflow will run
on:
  pull_request:
  push:
    branches: ['main']

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Grants the jobs read-only access to the repository; the minimum they need
permissions:
  contents: read

# Cancels an older run on the same branch when a newer commit is pushed
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Prettier's config lives in the root, so one check covers the whole repository
  format:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      # Installs the Node.js version pinned in package.json (volta.node) and caches npm downloads
      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting (Prettier)
        run: npm run prettier

  backend:
    runs-on: ubuntu-latest

    # Every run step below starts in backend/
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v7

      # The root package.json holds the Node.js pin; the cache key comes from the backend lockfile
      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check code quality (ESLint)
        run: npm run lint

      # Node.js runs the .ts files directly, so there is no build; tsc only checks types
      - name: Type-check (tsc)
        run: npm run typecheck

  frontend:
    runs-on: ubuntu-latest

    # Every run step below starts in frontend/
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v7

      # The root package.json holds the Node.js pin; the cache key comes from the frontend lockfile
      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check code quality (ESLint)
        run: npm run lint

      # tsc -b checks the types first, then Vite builds the app; a failure in either stops the job
      - name: Type-check and build (tsc, Vite)
        run: npm run build
